# HP EliteBook Ultra G1q (Snapdragon X1E-78-100)
#
# The same audio hardware as the HP OmniBook X14 it shares a baseboard with:
# two WSA884x speaker amplifiers, two microphones, a WCD938x headset codec and
# three DP outputs. alsa-ucm-conf configures all of them -- the OmniBook, the
# ThinkPad T14s, the Zenbook A14 -- from /Qualcomm/x1e80100/LENOVO-T14s.conf,
# selected by a DMI regex in the x1e80100 card file that names the OmniBook
# but not this machine ("HP-103C_5336AN HP EliteBook Ultra-8CBE").
#
# alsa-ucm-conf looks for conf.d/<card driver>/<card long name>.conf first, so
# naming this file after the card's long name reaches the same configuration
# without touching a file alsa-ucm-conf owns.
#
# RETIRE when alsa-ucm-conf's x1e80100 DMI regex covers HP's EliteBook Ultra
# line -- the maintainer asked for exactly that widening on PR #531 -- and
# delete this file; the card file then matches the machine on its own.

Syntax 4

Include.g1q.File "/Qualcomm/x1e80100/LENOVO-T14s.conf"
